name: VeriQ Load Test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to load test (must be a site you own/have permission to test)'
        required: true
        default: 'https://example.com'
      virtual_users:
        description: 'Number of virtual users (VUs)'
        required: true
        default: '10'
      duration:
        description: 'Test duration (e.g., 30s, 1m)'
        required: true
        default: '30s'
      ramp_up:
        description: 'Ramp-up time (e.g., 10s, 30s)'
        required: true
        default: '10s'
      acknowledge_disclaimer:
        description: 'I confirm I own or have explicit authorization to load test this target'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  run-load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Permission Disclaimer
        run: |
          if [ "${{ github.event.inputs.acknowledge_disclaimer }}" != "true" ]; then
            echo "::error::You must confirm that you own or have explicit written authorization to load test this URL."
            exit 1
          fi
          echo "Authorization confirmed for target: ${{ github.event.inputs.target_url }}"

      - name: Setup Grafana k6
        uses: grafana/setup-k6-action@v1

      - name: Generate k6 Test Scenario Script
        run: |
          cat << 'EOF' > load-test.js
          import http from 'k6/http';
          import { check, sleep } from 'k6';

          const TARGET_URL = __ENV.TARGET_URL || 'https://example.com';
          const VUS = parseInt(__ENV.VIRTUAL_USERS || '10', 10);
          const DURATION = __ENV.DURATION || '30s';
          const RAMP_UP = __ENV.RAMP_UP || '10s';

          export const options = {
            stages: [
              { duration: RAMP_UP, target: VUS },      // Ramp-up to target VUs
              { duration: DURATION, target: VUS },     // Stay at target VUs
              { duration: '5s', target: 0 }            // Ramp-down to 0
            ],
            thresholds: {
              http_req_failed: ['rate<0.05'],          // Error rate should be less than 5%
              http_req_duration: ['p(95)<2500'],       // 95% of requests should be below 2500ms
            },
          };

          export default function () {
            const params = {
              headers: {
                'User-Agent': 'VeriQ-LoadTest-Agent/1.0 (+https://github.com/VeriQ)',
                'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              },
              timeout: '10s'
            };

            const res = http.get(TARGET_URL, params);

            check(res, {
              'status is 200 or redirect': (r) => r.status >= 200 && r.status < 400,
              'response time < 2000ms': (r) => r.timings.duration < 2000,
            });

            sleep(1);
          }

          export function handleSummary(data) {
            return {
              'k6-summary.json': JSON.stringify(data, null, 2),
            };
          }
          EOF

      - name: Execute k6 Load Test
        id: k6_run
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          VIRTUAL_USERS: ${{ github.event.inputs.virtual_users }}
          DURATION: ${{ github.event.inputs.duration }}
          RAMP_UP: ${{ github.event.inputs.ramp_up }}
        run: |
          echo "Starting load test against $TARGET_URL with $VIRTUAL_USERS VUs..."
          k6 run load-test.js || echo "k6 finished with threshold breaches."

      - name: Generate Load Test Summary & Markdown Report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('k6-summary.json')) {
              core.setFailed('k6 summary report was not generated.');
              return;
            }

            const data = JSON.parse(fs.readFileSync('k6-summary.json', 'utf8'));
            const metrics = data.metrics || {};

            const targetUrl = '${{ github.event.inputs.target_url }}';
            const vus = '${{ github.event.inputs.virtual_users }}';
            const duration = '${{ github.event.inputs.duration }}';
            const rampUp = '${{ github.event.inputs.ramp_up }}';

            const reqDuration = metrics.http_req_duration ? metrics.http_req_duration.values : {};
            const reqFailed = metrics.http_req_failed ? metrics.http_req_failed.values : {};
            const reqTotal = metrics.http_reqs ? metrics.http_reqs.values.count : 0;
            const reqRate = metrics.http_reqs ? metrics.http_reqs.values.rate.toFixed(1) : 0;

            const avgMs = reqDuration.avg ? reqDuration.avg.toFixed(1) : 'N/A';
            const medMs = reqDuration.med ? reqDuration.med.toFixed(1) : 'N/A';
            const p90Ms = reqDuration['p(90)'] ? reqDuration['p(90)'].toFixed(1) : 'N/A';
            const p95Ms = reqDuration['p(95)'] ? reqDuration['p(95)'].toFixed(1) : 'N/A';
            const maxMs = reqDuration.max ? reqDuration.max.toFixed(1) : 'N/A';

            const failRate = reqFailed.rate ? (reqFailed.rate * 100).toFixed(2) : '0.00';
            const failPass = (parseFloat(failRate) < 5.0);
            const p95Pass = (parseFloat(p95Ms) < 2500);

            const md = `## 🚀 VeriQ Load & Stress Test Report

            **Target URL:** \`${targetUrl}\`
            **Virtual Users (VUs):** \`${vus}\`
            **Test Duration:** \`${duration}\` (Ramp-up: \`${rampUp}\`)
            **Total Requests:** \`${reqTotal}\` (\`${reqRate} req/sec\`)

            ### Performance Latency Overview

            | Metric | Measured Value | Standard Threshold | Evaluation |
            |---|---|---|---|
            | **Average Latency** | ${avgMs} ms | < 1000 ms | ${parseFloat(avgMs) < 1000 ? '🟢 Normal' : '🟡 Elevated'} |
            | **Median (p50)** | ${medMs} ms | < 800 ms | 🟢 Good |
            | **90th Percentile (p90)** | ${p90Ms} ms | < 2000 ms | ${parseFloat(p90Ms) < 2000 ? '🟢 Passed' : '🟡 High'} |
            | **95th Percentile (p95)** | ${p95Ms} ms | < 2500 ms | ${p95Pass ? '🟢 Passed' : '🔴 Breached'} |
            | **Max Latency** | ${maxMs} ms | - | ℹ️ Peak |
            | **Failed Requests Ratio** | **${failRate}%** | < 5.0% | ${failPass ? '🟢 Reliable' : '🔴 High Failure Rate'} |

            ${(!failPass || !p95Pass) ? '> [!WARNING]\n> **Load thresholds breached!** Under ' + vus + ' concurrent virtual users, server degradation was observed. Optimize server concurrency, caching, and database queries.' : '> [!NOTE]\n> **Target passed load capacity checks!** Zero significant performance degradation detected under configured concurrency.'}
            `;

            await core.summary.addRaw(md).write();

      - name: Upload Load Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veriq-load-test-summary
          path: |
            k6-summary.json
            load-test.js
          retention-days: 14
